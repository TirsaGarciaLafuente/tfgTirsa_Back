# Nombre de la aplicacion
spring.application.name=breakroom

# Conexion a la base de datos MySQL (Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/break_room_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Configuracion de JPA/Hibernate (Para que Java NO cree/actualice las tablas automaticamente)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect